# Letakkan location ini di dalam server{} HTTPS yang mem-proxy ke service.
# Tujuannya: domain publik tetap bisa dipakai backend/admin, tetapi /report
# hanya menerima IP provider. UFW melindungi akses langsung ke port service.
#
# Vhost yang mem-proxy seluruh "/" ke 127.0.0.1:5899 tetap dipertahankan;
# location = /report dievaluasi lebih spesifik.

location = /report {
    # IP egress IP Center (verifikasi dari log report, bukan tebakan).
    allow 203.0.113.10;
    deny all;

    proxy_pass http://127.0.0.1:5899;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
